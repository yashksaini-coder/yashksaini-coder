name: Refresh GitBanner
on:
  schedule:
    # Daily at an off-peak odd minute — GitHub delays crons scheduled at
    # popular times. The card only commits when the numbers actually changed.
    - cron: "47 2 * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yashksaini-coder/GitBanner@v1.3.0
        with:
          github-token: ${{ secrets.BANNER_TOKEN }}
          username: ${{ github.repository_owner }}
          output-path: ./assets/gitbanner
          format: both
          theme: dark
          include-private: true
          commit: true
          commit-message: "chore: refresh GitBanner stats"
